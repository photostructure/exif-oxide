name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (patch, minor, major)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Quick checks - format, clippy, and basic tests on Linux
  check:
    name: Format, Clippy & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-check-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-

      - name: Setup ExifTool for integration tests
        run: |
          echo "${{ github.workspace }}/third-party/exiftool" >> $GITHUB_PATH
          third-party/exiftool/exiftool -ver

      - name: Cache Perl dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/perl5
          key: perl5-${{ runner.os }}-${{ hashFiles('cpanfile') }}

      # check-perl syntax-checks scripts that `use PPI`/local::lib
      - name: Install Perl dependencies
        run: make perl-deps

      - name: Run format check, clippy, and tests
        run: make check

  # Cross-platform testing
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      - name: Setup ExifTool (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "${{ github.workspace }}/third-party/exiftool" >> $GITHUB_PATH
          third-party/exiftool/exiftool -ver

      - name: Run tests
        run: cargo test -p exif-oxide --features test-helpers,integration-tests --locked

      - name: Cache Perl dependencies (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/perl5
          key: perl5-${{ runner.os }}-${{ hashFiles('cpanfile') }}

      # The codegen crate's tests (including the PPI renderer regression
      # suite) shell out to Perl scripts that need PPI/JSON::XS, so they only
      # run where we install the Perl dependencies.
      - name: Run codegen tests (Linux)
        if: runner.os == 'Linux'
        run: |
          make perl-deps
          cargo test -p codegen --locked

  # Release - only runs on manual trigger
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [check, test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup ExifTool for integration tests
        run: |
          echo "${{ github.workspace }}/third-party/exiftool" >> "$GITHUB_PATH"
          third-party/exiftool/exiftool -ver

      - name: Set up SSH signing
        uses: photostructure/git-ssh-signing-action@abd2a642ab7d704f66193472b47c72375d85a0c1 # v2.0.1
        with:
          ssh-signing-key: ${{ secrets.SSH_SIGNING_KEY }}
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-user-email: ${{ secrets.GIT_USER_EMAIL }}

      - name: Install cargo-edit
        run: cargo install cargo-edit --version 0.13.13 --locked

      - name: Bump version
        id: bump
        shell: bash
        run: |
          cargo set-version --bump "${{ inputs.version }}" -p exif-oxide
          NEW_VERSION=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "exif-oxide") | .version')
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version bump scope
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only)
          if [[ "${changed_files[*]}" != "Cargo.lock Cargo.toml" ]]; then
            echo "Version bump changed unexpected files: ${changed_files[*]}"
            exit 1
          fi
          git diff --check

      - name: Commit version bump locally
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"

      - name: Validate bumped workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy -p exif-oxide --all-targets --all-features --locked -- -D warnings
          cargo test -p exif-oxide --features test-helpers,integration-tests --locked

      - name: Inspect packaged files
        run: cargo package --list --locked -p exif-oxide

      - name: Verify package
        run: cargo package --locked -p exif-oxide

      - name: Dry-run crates.io publish
        run: cargo publish --dry-run --locked -p exif-oxide

      - name: Create release tag
        run: |
          git tag "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"

      - name: Push changes and tag
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish exif-oxide to crates.io
        run: cargo publish --locked -p exif-oxide --token ${{ steps.auth.outputs.token }}
